# Frontend CI Workflow
#
# Tests and builds the React.js frontend application:
# - React app in src/web/ using Vitest
# - TypeScript compilation and linting

name: Frontend CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "src/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "src/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/frontend-ci.yml"

env:
  # Change this to invalidate existing cache.
  CACHE_PREFIX: v0
  NODE_VERSION: "22.x"
  PNPM_VERSION: "10.30.2"

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Set build variables
        shell: bash
        run: |
          echo "NODE_VERSION_FULL=$(node --version)" >> $GITHUB_ENV
          # Use week number in cache key so we can refresh the cache weekly.
          echo "WEEK_NUMBER=$(date +%V)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pnpm-store
            node_modules
            src/*/node_modules
          key: ${{ env.CACHE_PREFIX }}-${{ env.WEEK_NUMBER }}-${{ runner.os }}-${{ env.NODE_VERSION_FULL }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ env.WEEK_NUMBER }}-${{ runner.os }}-${{ env.NODE_VERSION_FULL }}

      - name: Install dependencies
        run: pnpm install

      - name: Build TypeSpec packages
        run: pnpm build:typespec

      - name: Test React Frontend
        run: |
          cd src/web
          pnpm test
        env:
          CI: true

      - name: Build React Frontend
        run: |
          cd src/web
          pnpm build
        env:
          CI: false
