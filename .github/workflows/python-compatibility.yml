name: Python Compatibility Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - resilv/py313

env:
  # Change this to invalidate existing cache.
  CACHE_PREFIX: v0
  PYTHON_PATH: ./

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python }} - ${{ matrix.os }} - ${{ matrix.task.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]  
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        task:
          - name: Build
            run: |
              pip list
              pip install twine
              # update setup related tools
              pip install --upgrade setuptools wheel
              pip list
              python setup.py check
              python setup.py bdist_wheel sdist
              # check package metadata
              twine check ./dist/*

#          - name: Test
#            run: |
#              pytest -v --color=yes tests/

#          - name: Lint
#            run: flake8 .

#          - name: Type check
#            run: mypy .

#          - name: Style
#            run: black --check .

#          - name: Docs
#            run: cd docs && make html

    steps:
      - uses: actions/checkout@v3
        # Submodules contain TypeSpec/web code - not needed for Python package compatibility testing
        # Uncomment the 'with' section below if you need to test TypeSpec integration or web components
        # with:
        #   submodules: ${{ runner.os != 'Windows' && 'recursive' || 'false' }}
      
      # Git long paths configuration - only needed if submodules are used (TypeSpec has long file paths)
      # Uncomment if you restore submodule checkout and encounter Windows path length issues
      # - name: Configure Git for long paths (Windows)
      #   if: runner.os == 'Windows'
      #   run: |
      #     git config --system core.longpaths true
      #     git submodule update --init --recursive

      # Node.js setup - only needed for web builds and TypeSpec compilation
      # Uncomment if you need to test web components or TypeSpec emitter functionality
      # - name: Setup Node.js
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: '20.x'

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python }}

      - name: Install prerequisites
        run: |
          pip install --upgrade pip setuptools wheel
          # Node.js/PNPM dependencies - only needed for web builds and TypeSpec compilation
          # Uncomment the lines below if you need to test web components or TypeSpec functionality
          # npm install -g pnpm@9.5.0
          # pnpm install

      - name: Set build variables
        shell: bash
        run: |
          # Get the exact Python version to use in the cache key.
          echo "PYTHON_VERSION=$(python --version)" >> $GITHUB_ENV
          # Architecture info - uncomment if you need platform-specific caching or debugging
          # echo "RUNNER_ARCH=$(uname -m)" >> $GITHUB_ENV
          # Node.js version - only needed for web/TypeSpec builds
          # echo "NODE_VERSION=$(node --version)" >> $GITHUB_ENV
          # Weekly cache refresh - uncomment if you want time-based cache invalidation
          # echo "WEEK_NUMBER=$(date +%V)" >> $GITHUB_ENV

      # Caching disabled for Python compatibility testing to ensure clean state every run
      # Uncomment the section below if you want to enable caching for faster builds
      # - uses: actions/cache@v3
      #   id: virtualenv-cache
      #   with:
      #     path: |
      #       .venv
      #     key: ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
      #     restore-keys: |
      #       ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ env.PYTHON_VERSION }}

      - name: Setup virtual environment - Unix/Linux/macOS
        if: runner.os != 'Windows'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e .[dev]
        shell: bash

      - name: Setup virtual environment - Windows
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          pip install -e .[dev]
        shell: pwsh

      - name: Show environment info - Unix/Linux/macOS
        if: runner.os != 'Windows'
        run: |
          . .venv/bin/activate
          which python
          python --version
          pip freeze
          # Node.js version info - uncomment if you need to verify Node.js/npm/pnpm versions
          # which node
          # node --version
          # npm --version
          # pnpm --version
        shell: bash

      - name: Show environment info - Windows
        if: runner.os == 'Windows'
        run: |
          .venv\Scripts\Activate.ps1
          Get-Command python
          python --version
          pip freeze
          # Node.js version info - uncomment if you need to verify Node.js/npm/pnpm versions
          # Get-Command node
          # node --version
          # npm --version
          # pnpm --version
        shell: pwsh

      # Web build steps - tests TypeScript/web components compilation and bundling
      # Uncomment if you need to verify that web components work with your Python package changes
      # - name: Build Web
      #   run: |
      #     pnpm build:typespec
      #     pnpm build:web
      #     pnpm bundle
      #   env:
      #     CI: false
      
      # TypeSpec emitter testing - tests the TypeSpec-to-code generation functionality
      # Uncomment if you need to verify TypeSpec emitter compatibility with your Python changes
      # - name: Test Typespec-aaz Emitter
      #   run: |
      #       pnpm test-aaz-emitter

      - name: ${{ matrix.task.name }} - Unix/Linux/macOS
        if: runner.os != 'Windows'
        run: |
          . .venv/bin/activate
          ${{ matrix.task.run }}
        shell: bash

      - name: ${{ matrix.task.name }} - Windows
        if: runner.os == 'Windows'
        run: |
          .venv\Scripts\Activate.ps1
          ${{ matrix.task.run }}
        shell: pwsh

      - name: Clean up - Unix/Linux/macOS
        if: always() && runner.os != 'Windows'
        run: |
          . .venv/bin/activate
          pip uninstall -y aaz-dev || true
        shell: bash

      - name: Clean up - Windows
        if: always() && runner.os == 'Windows'
        run: |
          .venv\Scripts\Activate.ps1
          pip uninstall -y aaz-dev; if ($LASTEXITCODE -ne 0) { Write-Host "Package not found or already uninstalled" }
        shell: pwsh
